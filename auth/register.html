<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../js/maintenance.js"></script>
  <script src="../js/maintenance-preview.js"></script>
  <script src="../js/maintenance-check.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your FH Development account." />
  <title>Create Account — FH Development</title>
  <link rel="icon" href="https://cdn.fh-development.xyz/departmental/logos/Real_White_Logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#2563EB',bright:'#3B82F6',sky:'#0EA5E9'},fontFamily:{display:['Sora','sans-serif'],body:['Inter','sans-serif']}}}}}</script>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="../js/config.js"></script>
</head>
<body class="bg-[#0F172A] font-body text-slate antialiased min-h-screen flex flex-col items-center justify-center py-12 px-6" data-page="authRegister">
  <a href="../index.html" class="mb-10 inline-block">
    <img src="https://cdn.fh-development.xyz/departmental/logos/Real_White_Logo.png" alt="FH Development" class="h-14 w-auto object-contain" />
  </a>
  <div class="w-full max-w-sm bg-white rounded-2xl border border-[#E2E8F0] shadow-sm p-8">
    <h1 class="font-display font-bold text-2xl text-[#0F172A] mb-2">Create account</h1>
    <p class="text-[#64748B] text-sm mb-7">Join FH Development to access products and resources.</p>
    <form data-form="register" class="space-y-4" novalidate>
      <div>
        <label class="block text-sm font-medium text-[#0F172A] mb-1.5" for="reg-username">Username</label>
        <input id="reg-username" name="username" type="text" autocomplete="username" placeholder="e.g. johndoe99" class="w-full h-11 px-4 rounded-xl border border-[#E2E8F0] text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-primary transition-colors" required minlength="3" maxlength="30" />
      </div>
      <div>
        <label class="block text-sm font-medium text-[#0F172A] mb-1.5" for="reg-name">Display Name <span class="text-[#94A3B8] text-xs font-normal">(optional)</span></label>
        <input id="reg-name" name="displayName" type="text" autocomplete="name" placeholder="Your name" class="w-full h-11 px-4 rounded-xl border border-[#E2E8F0] text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-primary transition-colors" />
      </div>
      <div>
        <label class="block text-sm font-medium text-[#0F172A] mb-1.5" for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" class="w-full h-11 px-4 rounded-xl border border-[#E2E8F0] text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-primary transition-colors" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-[#0F172A] mb-1.5" for="reg-password">Password</label>
        <input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" class="w-full h-11 px-4 rounded-xl border border-[#E2E8F0] text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-primary transition-colors" required />
      </div>
      <div id="reg-error" class="hidden text-red-500 text-sm font-medium"></div>
      <button type="submit" class="btn-primary w-full justify-center py-3">Create Account</button>
    </form>
    <div class="mt-6 pt-6 border-t border-[#E2E8F0] text-center">
      <p class="text-sm text-[#64748B]">Already have an account? <a href="login.html" class="text-primary font-semibold hover:underline">Sign in</a></p>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
