<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../js/maintenance.js"></script>
  <script src="../js/maintenance-preview.js"></script>
  <script src="../js/maintenance-check.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your FH Development account password." />
  <title>Reset Password — FH Development</title>
  <link rel="icon" href="https://cdn.fh-development.xyz/departmental/logos/Real_White_Logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#2563EB',bright:'#3B82F6',sky:'#0EA5E9'},fontFamily:{display:['Sora','sans-serif'],body:['Inter','sans-serif']}}}}</script>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="../js/config.js"></script>
</head>
<body class="bg-[#0F172A] font-body text-slate antialiased min-h-screen flex flex-col items-center justify-center py-12 px-6" data-page="authReset">
  <a href="../index.html" class="mb-10 inline-block">
    <img src="https://cdn.fh-development.xyz/departmental/logos/Real_White_Logo.png" alt="FH Development" class="h-14 w-auto object-contain" />
  </a>
  <div class="w-full max-w-sm bg-white rounded-2xl border border-[#E2E8F0] shadow-sm p-8">
    <h1 class="font-display font-bold text-2xl text-[#0F172A] mb-2">Set new password</h1>
    <p class="text-[#64748B] text-sm mb-7">Choose a strong password for your account.</p>
    <form data-form="reset" class="space-y-4" novalidate>
      <div>
        <label class="block text-sm font-medium text-[#0F172A] mb-1.5" for="new-pass">New Password</label>
        <input id="new-pass" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" class="w-full h-11 px-4 rounded-xl border border-[#E2E8F0] text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-primary transition-colors" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-[#0F172A] mb-1.5" for="conf-pass">Confirm Password</label>
        <input id="conf-pass" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat password" minlength="8" class="w-full h-11 px-4 rounded-xl border border-[#E2E8F0] text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-primary transition-colors" required />
      </div>
      <button type="submit" class="btn-primary w-full justify-center py-3">Reset Password</button>
    </form>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
