<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your FH Development account." />
  <title>Sign In — FH Development</title>
  <link rel="icon" href="https://cdn.fh-development.xyz/departmental/logos/Real_White_Logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#2563EB',bright:'#3B82F6',sky:'#0EA5E9'},fontFamily:{display:['Sora','sans-serif'],body:['Inter','sans-serif']}}}}</script>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="../js/config.js"></script>
</head>
<body class="bg-[#0F172A] font-body text-slate antialiased min-h-screen flex flex-col items-center justify-center py-12 px-6" data-page="authLogin">
  <a href="../index.html" class="mb-10 inline-block">
    <img src="https://cdn.fh-development.xyz/departmental/logos/Real_White_Logo.png" alt="FH Development" class="h-14 w-auto object-contain" />
  </a>
  <div class="w-full max-w-sm bg-white rounded-2xl border border-[#E2E8F0] shadow-sm p-8">
    <h1 class="font-display font-bold text-2xl text-[#0F172A] mb-2">Welcome back</h1>
    <p class="text-[#64748B] text-sm mb-7">Sign in to your FH Development account.</p>
    <form data-form="login" class="space-y-4" novalidate>
      <div>
        <label class="block text-sm font-medium text-[#0F172A] mb-1.5" for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" class="w-full h-11 px-4 rounded-xl border border-[#E2E8F0] text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-primary transition-colors" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-[#0F172A] mb-1.5" for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" class="w-full h-11 px-4 rounded-xl border border-[#E2E8F0] text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-primary transition-colors" required />
      </div>
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-[#64748B] cursor-pointer"><input type="checkbox" class="rounded" /> Remember me</label>
        <a href="forgot-password.html" class="text-primary font-medium hover:underline">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary w-full justify-center py-3">Sign In</button>
    </form>
    <div class="mt-6 pt-6 border-t border-[#E2E8F0] text-center">
      <p class="text-sm text-[#64748B]">Don't have an account? <a href="register.html" class="text-primary font-semibold hover:underline">Create one</a></p>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
